# Every night: download the chains' public price files and publish the result on GitHub Pages
name: nightly prices
on:
  schedule:
    - cron: '30 4 * * *'   # 04:30 UTC = 06:30/07:30 in Israel: after the chains publish (Carrefour about 05:10) and after local.sh (05:45)
  workflow_dispatch:        # "Run workflow" button, for a run by hand
permissions:
  contents: write           # to save new branch locations (geocode.json)
  pages: write
  id-token: write
  issues: write             # one issue listing branches without a location (notify.mjs)
concurrency: { group: prices, cancel-in-progress: false }
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Carrefour and Hatzi Hinam, fetched by the computer in Israel (local.sh)
        run: mkdir israel && (gh release download israel -p local.tgz -D israel && tar xzf israel/local.tgz -C israel || echo "no run from Israel")
        env: { GH_TOKEN: '${{ github.token }}' }
      - run: node job.mjs --merge=israel
      - name: Branches without a location (an email only when the list changes)
        run: node notify.mjs
        env: { GH_TOKEN: '${{ github.token }}' }
      - name: Save new locations
        run: |
          git config user.name "tudu-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add geocode.json cities.json
          git diff --cached --quiet || (git commit -m "New branch locations" && git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - id: deploy
        uses: actions/deploy-pages@v4
